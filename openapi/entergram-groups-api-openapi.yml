openapi: 3.2.0
info:
  contact:
    email: hello@entergram.com
    name: Entergram
  description: Secure, workspace-scoped API for Entergram PRO. Use API keys created in Settings > Developers to access workspace metadata, accounts, contacts, groups, chats, custom fields, and tickets through a stable, documented contract.
  title: Entergram Public Groups API
  version: v1
security:
- ApiKeyAuth: []
tags:
- description: Workspace groups derived from shared-contact graph, with invite-link and member metadata when cached.
  name: Groups
paths:
  /v1/groups:
    get:
      description: Returns groups derived from workspace contact graph data, enriched with cached invite-link and member-count metadata when available.
      operationId: list-groups
      parameters:
      - description: Number of groups to return per page.
        explode: false
        in: query
        name: limit
        schema:
          default: 50
          description: Number of groups to return per page.
          examples:
          - 50
          format: int64
          maximum: 200
          minimum: 1
          type: integer
      - description: Zero-based offset for pagination.
        explode: false
        in: query
        name: offset
        schema:
          default: 0
          description: Zero-based offset for pagination.
          examples:
          - 0
          format: int64
          minimum: 0
          type: integer
      - description: Case-insensitive search over group id, title, and username.
        explode: false
        in: query
        name: search
        schema:
          description: Case-insensitive search over group id, title, and username.
          examples:
          - community
          type: string
      - description: Optional filter for groups exposed by a specific workspace member id.
        explode: false
        in: query
        name: member_id
        schema:
          description: Optional filter for groups exposed by a specific workspace member id.
          examples:
          - user_demo_123
          type: string
      - description: Optional filter for groups exposed by a specific connected account id.
        explode: false
        in: query
        name: account_id
        schema:
          description: Optional filter for groups exposed by a specific connected account id.
          examples:
          - acct_demo_123
          type: string
      - description: Optional exact chat-type filter.
        explode: false
        in: query
        name: chat_type
        schema:
          description: Optional exact chat-type filter.
          examples:
          - group
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupsEnvelope'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Forbidden
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
      summary: List workspace groups
      tags:
      - Groups
      x-required-scopes:
      - contacts.read
  /v1/groups/{group_id}:
    get:
      description: Returns a single workspace group identified by canonical Telegram chat id.
      operationId: get-group
      parameters:
      - description: Canonical Telegram chat identifier for the group.
        in: path
        name: group_id
        required: true
        schema:
          description: Canonical Telegram chat identifier for the group.
          examples:
          - '-1000001234567'
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupEnvelope'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Not Found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
      summary: Get one workspace group
      tags:
      - Groups
      x-required-scopes:
      - contacts.read
  /v1/groups/{group_id}/members:
    get:
      description: Returns workspace contacts that appear inside the group, deduplicated by Telegram user id and enriched with observed roles and account attribution.
      operationId: list-group-members
      parameters:
      - description: Canonical Telegram chat identifier for the group.
        in: path
        name: group_id
        required: true
        schema:
          description: Canonical Telegram chat identifier for the group.
          examples:
          - '-1000001234567'
          type: string
      - description: Number of members to return per page.
        explode: false
        in: query
        name: limit
        schema:
          default: 50
          description: Number of members to return per page.
          examples:
          - 50
          format: int64
          maximum: 200
          minimum: 1
          type: integer
      - description: Zero-based offset for pagination.
        explode: false
        in: query
        name: offset
        schema:
          default: 0
          description: Zero-based offset for pagination.
          examples:
          - 0
          format: int64
          minimum: 0
          type: integer
      - description: Case-insensitive search over member Telegram id, names, username, and bio.
        explode: false
        in: query
        name: search
        schema:
          description: Case-insensitive search over member Telegram id, names, username, and bio.
          examples:
          - alex
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMembersEnvelope'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Not Found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
      summary: List members of a workspace group
      tags:
      - Groups
      x-required-scopes:
      - contacts.read
components:
  schemas:
    GroupMembersEnvelope:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/GroupMembersList'
      required:
      - data
      type: object
    WorkspaceGroupMemberSummary:
      additionalProperties: false
      properties:
        bio:
          description: Cached Telegram bio when available.
          examples:
          - Synthetic example contact for API documentation.
          type:
          - string
          - 'null'
        firstName:
          description: Best available first name.
          examples:
          - Alex
          type: string
        isBot:
          description: Whether the contact is a bot.
          examples:
          - false
          type: boolean
        isPremium:
          description: Whether the contact has Telegram Premium.
          examples:
          - true
          type: boolean
        knownByAccounts:
          description: Connected accounts that expose this member inside the group.
          items:
            $ref: '#/components/schemas/WorkspaceGroupKnownByAccountSummary'
          type:
          - array
          - 'null'
        lastName:
          description: Best available last name.
          examples:
          - Example
          type:
          - string
          - 'null'
        roles:
          description: Distinct roles observed for the contact inside this group.
          items:
            type: string
          type:
          - array
          - 'null'
        telegramUserId:
          description: Canonical Telegram user identifier for the contact.
          examples:
          - '1000009876'
          type: string
        username:
          description: Telegram username when available.
          examples:
          - alex_example
          type:
          - string
          - 'null'
      required:
      - telegramUserId
      - firstName
      - lastName
      - username
      - bio
      - isBot
      - isPremium
      - roles
      - knownByAccounts
      type: object
    GroupMembersList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/WorkspaceGroupMemberSummary'
          type:
          - array
          - 'null'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - items
      - pagination
      type: object
    WorkspaceGroupSummary:
      additionalProperties: false
      properties:
        chatType:
          description: Normalized chat type.
          examples:
          - group
          type: string
        contactCount:
          description: Number of workspace contacts that share this group.
          examples:
          - 12
          format: int64
          type: integer
        displayName:
          description: Best available group title.
          examples:
          - Community Alpha
          type: string
        groupId:
          description: Canonical Telegram chat identifier for the group.
          examples:
          - '-1000001234567'
          type: string
        inviteLink:
          description: Most recently cached invite link for the group.
          examples:
          - https://t.me/+sampleinvite123
          type:
          - string
          - 'null'
        inviteLinkUpdatedAt:
          description: Timestamp of the last invite-link refresh.
          format: date-time
          type:
          - string
          - 'null'
        knownByAccounts:
          description: Connected accounts in the workspace that expose this group.
          items:
            $ref: '#/components/schemas/WorkspaceGroupKnownByAccountSummary'
          type:
          - array
          - 'null'
        memberCount:
          description: Cached member count for the group.
          examples:
          - 245
          format: int64
          type:
          - integer
          - 'null'
        participantCount:
          description: Member count rendered for compatibility with group analytics views.
          examples:
          - 245
          format: int64
          type: integer
        username:
          description: Telegram username for the group when available.
          examples:
          - samplecommunity
          type:
          - string
          - 'null'
      required:
      - groupId
      - displayName
      - username
      - chatType
      - inviteLink
      - inviteLinkUpdatedAt
      - memberCount
      - participantCount
      - contactCount
      - knownByAccounts
      type: object
    GroupsEnvelope:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/GroupsList'
      required:
      - data
      type: object
    GroupsList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/WorkspaceGroupSummary'
          type:
          - array
          - 'null'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - items
      - pagination
      type: object
    Pagination:
      additionalProperties: false
      properties:
        hasMore:
          type: boolean
        limit:
          format: int64
          type: integer
        nextOffset:
          format: int64
          type:
          - integer
          - 'null'
        offset:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
      - limit
      - offset
      - total
      - hasMore
      - nextOffset
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    WorkspaceGroupKnownByAccountSummary:
      additionalProperties: false
      properties:
        accountId:
          description: Connected account identifier.
          examples:
          - acct_demo_123
          type: string
        displayName:
          description: Operator-facing label for the connected account.
          examples:
          - Ops Sample
          type:
          - string
          - 'null'
        ownerDisplayName:
          description: Display name of the workspace member that owns the connected account.
          examples:
          - Alex Example
          type:
          - string
          - 'null'
        ownerUserId:
          description: Workspace member id that owns the connected account.
          examples:
          - user_demo_123
          type: string
        role:
          description: Role observed for that connected account in the group.
          examples:
          - member
          type: string
        username:
          description: Telegram username of the connected account.
          examples:
          - ops_sample
          type:
          - string
          - 'null'
      required:
      - accountId
      - username
      - displayName
      - ownerUserId
      - ownerDisplayName
      - role
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
          - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type:
          - array
          - 'null'
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
          - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
          - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
          - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
          - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GroupEnvelope:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceGroupSummary'
      required:
      - data
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: Workspace-scoped PRO API key created in Entergram Settings > Developers.
      in: header
      name: X-API-Key
      type: apiKey
x-entergram-scopes:
- workspace.read
- members.read
- accounts.read
- contacts.read
- chats.read
- chats.write
- messages.read
- messages.write
- custom_fields.read
- custom_fields.write
- tickets.read
- tickets.write
- events.read
- webhooks.read
- webhooks.write
