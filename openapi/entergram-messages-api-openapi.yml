  /v1/chats/{chat_id}/messages/{message_id}/media:
    get:
      description: Streams the message media as binary data. Supports a single HTTP byte range for resumable and chunked downloads.
      operationId: download-chat-message-media
      parameters:
      - description: Canonical Telegram chat identifier.
        in: path
        name: chat_id
        required: true
        schema:
          description: Canonical Telegram chat identifier.
          examples:
          - '-1000001234567'
          type: string
      - description: Telegram message identifier within the chat.
        in: path
        name: message_id
        required: true
        schema:
          description: Telegram message identifier within the chat.
          examples:
          - 123456
          format: int64
          minimum: 1
          type: integer
      - description: Connected account id used to download the media.
        explode: false
        in: query
        name: account_id
        schema:
          description: Connected account id used to download the media.
          examples:
          - acct_demo_123
          type: string
      - description: Optional single HTTP byte range, for example bytes=0-5242879.
        in: header
        name: Range
        schema:
          description: Optional single HTTP byte range, for example bytes=0-5242879.
          examples:
          - bytes=0-5242879
          type: string
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: Complete media payload
        '206':
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: Requested media byte range
        '400':
