openapi: 3.2.0
info:
  contact:
    email: hello@entergram.com
    name: Entergram
  description: Secure, workspace-scoped API for Entergram PRO. Use API keys created in Settings > Developers to access workspace metadata, accounts, contacts, groups, chats, custom fields, and tickets through a stable, documented contract.
  title: Entergram Public Messages API
  version: v1
security:
- ApiKeyAuth: []
tags:
- description: Telegram message history and message write operations scoped to an explicit account and chat.
  name: Messages
paths:
  /v1/chats/{chat_id}/messages:
    get:
      description: Returns message history for the given chat as seen by the selected connected account.
      operationId: list-chat-messages
      parameters:
      - description: Canonical Telegram chat identifier.
        in: path
        name: chat_id
        required: true
        schema:
          description: Canonical Telegram chat identifier.
          examples:
          - '-1000001234567'
          type: string
      - description: Connected account id from the accounts endpoint used to scope the chat history request.
        explode: false
        in: query
        name: account_id
        schema:
          description: Connected account id from the accounts endpoint used to scope the chat history request.
          examples:
          - acct_demo_123
          type: string
      - description: Number of messages to return.
        explode: false
        in: query
        name: limit
        schema:
          default: 50
          description: Number of messages to return.
          examples:
          - 50
          format: int64
          maximum: 100
          minimum: 1
          type: integer
      - description: Fetch messages older than this Telegram message id.
        explode: false
        in: query
        name: before_message_id
        schema:
          description: Fetch messages older than this Telegram message id.
          examples:
          - 123456
          format: int64
          type: integer
      - description: Reserved for forum topics. Not supported yet.
        explode: false
        in: query
        name: thread_id
        schema:
          description: Reserved for forum topics. Not supported yet.
          examples:
          - 77
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesPageEnvelope'
          description: OK
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Bad Request
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Not Found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Too Many Requests
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
        '502':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Bad Gateway
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Service Unavailable
        '504':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Gateway Timeout
      summary: List Telegram messages for a chat and account
      tags:
      - Messages
      x-required-scopes:
      - messages.read
    post:
      description: Sends a Telegram message using the chosen connected account. The destination may be an existing canonical chat id or a public Telegram username resolved live by that account.
      operationId: create-chat-message
      parameters:
      - description: Canonical Telegram chat identifier or public Telegram username for a new direct conversation.
        in: path
        name: chat_id
        required: true
        schema:
          description: Canonical Telegram chat identifier or public Telegram username for a new direct conversation.
          examples:
          - '@alex_example'
          type: string
      requestBody:
