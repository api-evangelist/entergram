openapi: 3.2.0
info:
  contact:
    email: hello@entergram.com
    name: Entergram
  description: Secure, workspace-scoped API for Entergram PRO. Use API keys created in Settings > Developers to access workspace metadata, accounts, contacts, groups, chats, custom fields, and tickets through a stable, documented contract.
  title: Entergram Public System API
  version: v1
security:
- ApiKeyAuth: []
tags:
- description: Authentication and runtime context.
  name: System
paths:
  /v1/me:
    get:
      operationId: get-me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Get the authenticated API key context
      tags:
      - System
components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    MeWorkspaceSummary:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
      type: object
    ApiKeySummary:
      additionalProperties: false
      properties:
        expiresAt:
          format: date-time
          type: string
        keyId:
          type: string
        keyPrefix:
          type: string
        scopes:
          items:
            type: string
          type:
          - array
          - 'null'
      required:
      - keyId
      - keyPrefix
      - expiresAt
      - scopes
      type: object
    MeEnvelope:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/MeResponse'
      required:
      - data
      type: object
    MeResponse:
      additionalProperties: false
      properties:
        apiKey:
          $ref: '#/components/schemas/ApiKeySummary'
        workspace:
          $ref: '#/components/schemas/MeWorkspaceSummary'
      required:
      - apiKey
      - workspace
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
          - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type:
          - array
          - 'null'
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
          - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
          - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
          - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
          - https://example.com/errors/example
          format: uri
          type: string
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: Workspace-scoped PRO API key created in Entergram Settings > Developers.
      in: header
      name: X-API-Key
      type: apiKey
x-entergram-scopes:
- workspace.read
- members.read
- accounts.read
- contacts.read
- chats.read
- chats.write
- messages.read
- messages.write
- custom_fields.read
- custom_fields.write
- tickets.read
- tickets.write
- events.read
- webhooks.read
- webhooks.write
