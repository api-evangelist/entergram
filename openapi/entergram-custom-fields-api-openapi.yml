          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
      summary: Create a workspace chat custom column
      tags:
      - Custom Fields
      x-required-scopes:
      - custom_fields.write
  /v1/custom-columns/{column_id}:
