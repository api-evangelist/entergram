components:
  schemas:
    ChatCustomFieldsEnvelope:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/ChatCustomFieldsResource'
      required:
      - data
      type: object
    ColumnsList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/FieldColumnSummary'
          type:
          - array
          - 'null'
      required:
      - items
      type: object
    PatchChatCustomFieldsBody:
      additionalProperties: false
      properties:
        values:
          additionalProperties: {}
          description: Partial patch keyed by custom-column key. Send null or an empty string to delete a field.
          type: object
      required:
      - values
      type: object
    DeletedResource:
      additionalProperties: false
      properties:
        id:
          description: Deleted resource identifier.
          examples:
          - column_demo_123
          type: string
      required:
      - id
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
          - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type:
          - array
          - 'null'
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
          - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
          - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
          - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
          - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ColumnEnvelope:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/FieldColumnSummary'
      required:
      - data
      type: object
    OptionEnvelope:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/FieldOptionSummary'
      required:
      - data
      type: object
    UpdateColumnBody:
      additionalProperties: false
      properties:
        defaultValue:
          description: Updated JSON default value. Pass null to clear it.
        isRequired:
          description: Updated required flag.
          examples:
          - true
          type: boolean
        name:
          description: Updated human-readable field label.
          examples:
          - Account Segment
          type: string
        options:
          description: Full replacement for selectable options. Send an empty array to clear all options.
          items:
            $ref: '#/components/schemas/CreateOptionBody'
          type: array
        order:
          description: Updated display order.
          examples:
          - 4
          format: int64
          type: integer
        type:
          description: Updated field input type.
          examples:
          - multiselect
          type: string
      type: object
    OptionsList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/FieldOptionSummary'
          type:
          - array
          - 'null'
      required:
      - items
      type: object
    UpdateOptionBody:
      additionalProperties: false
      properties:
        color:
          description: Updated hex color token.
          examples:
          - '#1d4ed8'
          type: string
        label:
          description: Updated option label.
          examples:
          - Qualified Plus
          type: string
        value:
          description: Updated stable option value.
          examples:
          - qualified_plus
          type: string
      type: object
    FieldColumnSummary:
      additionalProperties: false
      properties:
        createdAt:
          description: Column creation timestamp.
          format: date-time
          type: string
        defaultValue:
          description: Default JSON value applied in client UIs when present.
        id:
          description: Column identifier.
          examples:
          - column_demo_123
          type: string
        isRequired:
          description: Whether the field is required in the operator UI.
          examples:
          - false
          type: boolean
        key:
          description: Stable field key used in payloads.
          examples:
          - relationship_stage
          type: string
        name:
          description: Human-readable field label.
          examples:
          - Relationship Stage
          type: string
        options:
          description: Selectable options for select and multiselect fields.
          items:
            $ref: '#/components/schemas/FieldOptionSummary'
          type:
          - array
          - 'null'
        order:
          description: Ascending display order in Entergram UI.
          examples:
          - 3
          format: int64
          type: integer
        type:
          description: Column input type.
          examples:
          - select
          type: string
        updatedAt:
          description: Column last update timestamp.
          format: date-time
          type: string
      required:
      - id
      - name
      - key
      - type
      - isRequired
      - order
      - createdAt
      - updatedAt
      - options
      type: object
    DeletedEnvelope:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/DeletedResource'
      required:
      - data
      type: object
    FieldOptionSummary:
      additionalProperties: false
      properties:
        color:
          description: Hex color token for UI badges.
          examples:
          - '#3b82f6'
          type: string
        createdAt:
          description: Option creation timestamp.
          format: date-time
          type: string
        id:
          description: Option identifier.
          examples:
          - field_option_demo_123
          type: string
        label:
          description: Human-readable option label.
          examples:
          - Qualified
          type: string
        updatedAt:
          description: Option last update timestamp.
          format: date-time
          type: string
        value:
          description: Stable option value stored in field payloads.
          examples:
          - qualified
          type: string
      required:
      - id
      - value
      - label
      - color
      - createdAt
      - updatedAt
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    CreateColumnBody:
      additionalProperties: false
      properties:
        defaultValue:
          description: Optional JSON default value, for example a string, boolean, or array payload.
        isRequired:
          description: Whether the field is required in the operator UI.
          examples:
          - false
          type: boolean
        key:
          description: Optional stable key. When omitted it is slugified from the name.
          examples:
          - relationship_stage
          type: string
        name:
          description: Human-readable field label.
          examples:
          - Relationship Stage
          minLength: 1
          type: string
        options:
          description: Optional option list for select and multiselect fields.
          items:
            $ref: '#/components/schemas/CreateOptionBody'
          type:
          - array
          - 'null'
        order:
          description: Optional explicit display order.
          examples:
          - 3
          format: int64
          type: integer
        type:
          description: Field input type.
          examples:
          - select
          type: string
      required:
      - name
      - type
      type: object
    OptionsEnvelope:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/OptionsList'
      required:
      - data
      type: object
    CreateOptionBody:
      additionalProperties: false
      properties:
        color:
          description: Hex color token used by Entergram UI.
          examples:
          - '#3b82f6'
          type: string
        label:
          description: Human-readable label.
          examples:
          - Qualified
          minLength: 1
          type: string
        value:
          description: Stable value stored in field payloads.
          examples:
          - qualified
          minLength: 1
          type: string
      required:
      - value
      - label
      type: object
    ChatCustomFieldsResource:
      additionalProperties: false
      properties:
        telegramChatId:
          description: Canonical Telegram chat identifier.
          examples:
          - '-1000001234567'
          type: string
        values:
          additionalProperties: {}
          description: Custom field values keyed by custom-column key.
          type: object
      required:
      - telegramChatId
      - values
      type: object
    ColumnsEnvelope:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/ColumnsList'
      required:
      - data
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: Workspace-scoped PRO API key created in Entergram Settings > Developers.
      in: header
      name: X-API-Key
      type: apiKey
x-entergram-scopes:
- workspace.read
- members.read
- accounts.read
- contacts.read
- chats.read
- chats.write
- messages.read
- messages.write
- custom_fields.read
- custom_fields.write
- tickets.read
- tickets.write
- events.read
- webhooks.read
- webhooks.write
