name: Entergram
description: >-
  Entergram is a CRM built specifically for Telegram. It connects personal Telegram accounts (not bots)
  into a shared team workspace where sales, support, community and trading teams manage conversations at
  scale — a multi-account inbox, a CRM table and Kanban pipeline, custom columns and labels, broadcast
  messaging, and a ticketing system with assignment, SLA and status tracking. Its developer surface has
  three parts: a workspace-scoped REST API (X-API-Key) covering accounts, contacts, groups, chats,
  messages, custom fields, tickets, webhooks and resumable events; a hosted Model Context Protocol (MCP)
  server for personal Telegram accounts (OAuth2 + PKCE) that lets AI agents read chats, manage tickets
  and update CRM fields; and outbound webhooks for incoming/outgoing message events, plus a Make.com
  integration.
